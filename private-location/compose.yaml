name: checkly-private-location

networks:
  default:
    name: checkly-private-location
  opentelemetry-demo:
    external: true

services:
  agent:
    image: checkly/agent:latest
    container_name: checkly-agent
    restart: unless-stopped
    networks:
      - default
      - opentelemetry-demo
    env_file:
      - ../.env
    environment:
      CHECKLY_API_KEY: ""
      CHECKLY_ACCOUNT_ID: ""
    volumes:
      - ./logs:/var/log/checkly
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "-c"]
    command:
      - ': "$${API_KEY:?is empty — set it in the repo-root .env (see .env.example)}"; /usr/local/bin/entrypoint-agent.sh 2>&1 | tee -a /var/log/checkly/agent.log'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: 2
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
